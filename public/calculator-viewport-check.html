<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>반응형 검증</title><style>body{margin:20px;background:#edf0f5;color:#111b35;font:16px system-ui}nav{display:flex;gap:12px;align-items:center;margin-bottom:20px}select{font:inherit;padding:8px}iframe{display:block;width:375px;height:820px;border:1px solid #ccd2e0;border-radius:14px;background:white}</style><nav><label for="width">화면 너비</label><select id="width"><option value="375">375px</option><option value="390">390px</option><option value="360">360px</option><option value="768">768px</option></select><span>테스트 배포 전용</span></nav><iframe title="모바일 그리온 미리보기" src="/#growth-calculator"></iframe><script>document.querySelector("select").addEventListener("change",event=>document.querySelector("iframe").style.width=event.target.value+"px")</script></html>
